<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Dion Stacey Sellar — Software Engineer, Full-Stack Developer and AI Enthusiast</title>
  <desc id="desc">Premium midnight navy developer banner with cyan and violet lighting, subtle grid, code panel and abstract circuit details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B16"/><stop offset=".55" stop-color="#101D38"/><stop offset="1" stop-color="#082F49"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14243D" stop-opacity=".96"/><stop offset="1" stop-color="#0A1428" stop-opacity=".92"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#A5F3FC" stroke-opacity=".075"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <circle cx="1040" cy="95" r="160" fill="#22D3EE" opacity=".12" filter="url(#blur)"/>
  <circle cx="900" cy="290" r="125" fill="#818CF8" opacity=".12" filter="url(#blur)"/>
  <path d="M0 286C230 220 360 340 600 260S970 205 1200 260" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".45"/>
  <g transform="translate(70 78)">
    <text x="0" y="0" fill="#67E8F9" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="4">SOFTWARE ENGINEERING · FULL-STACK · AI</text>
    <text x="0" y="76" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="53" font-weight="800" letter-spacing="-.8">DION STACEY SELLAR</text>
    <rect x="2" y="101" width="132" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="151" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="21">Turning ideas into useful, thoughtful software.</text>
    <text x="0" y="194" fill="#A5F3FC" font-family="monospace" font-size="15">BUILD WITH CURIOSITY. ENGINEER WITH CARE.</text>
  </g>
  <g transform="translate(790 82)">
    <rect width="340" height="184" rx="17" fill="url(#panel)" stroke="#67E8F9" stroke-opacity=".32"/>
    <path d="M0 42H340" stroke="#67E8F9" stroke-opacity=".18"/>
    <circle cx="24" cy="21" r="5" fill="#FB7185"/><circle cx="43" cy="21" r="5" fill="#FBBF24"/><circle cx="62" cy="21" r="5" fill="#34D399"/>
    <text x="88" y="26" fill="#94A3B8" font-family="monospace" font-size="12">developer.ts</text>
    <g font-family="monospace" font-size="15">
      <text x="24" y="78" fill="#C4B5FD">const</text><text x="78" y="78" fill="#67E8F9"> developer</text><text x="174" y="78" fill="#E2E8F0"> = {</text>
      <text x="42" y="108" fill="#A5F3FC">build:</text><text x="108" y="108" fill="#86EFAC"> "with purpose",</text>
      <text x="42" y="138" fill="#A5F3FC">learn:</text><text x="108" y="138" fill="#86EFAC"> "every day"</text>
      <text x="24" y="166" fill="#E2E8F0">};</text>
    </g>
  </g>
  <g fill="none" stroke="#67E8F9" opacity=".35"><circle cx="1120" cy="58" r="22"/><circle cx="1120" cy="58" r="34"/><path d="M1120 24V8M1154 58H1170"/></g>
</svg>