<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Let's build something meaningful — Dion Stacey Sellar</title>
  <desc id="desc">Matching midnight navy and cyan developer contact banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B16"/><stop offset=".55" stop-color="#101D38"/><stop offset="1" stop-color="#082F49"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#BAE6FD" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
